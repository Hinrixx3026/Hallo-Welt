<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kleenernetz – Packet Catch</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--bg:#0b1020;--panel:rgba(17,24,39,.84);--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#aab6c7;--green:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 15%,rgba(59,130,246,.18),transparent 30%),radial-gradient(circle at 85% 80%,rgba(34,197,94,.14),transparent 30%),var(--bg);color:var(--text);overflow:hidden}
.app{width:min(900px,100%);display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 16px #22c55e}
.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:14px}.pill b{color:white}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.game{height:min(70svh,620px);min-height:500px;position:relative;overflow:hidden;touch-action:manipulation;user-select:none;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}
.packet{position:absolute;width:62px;height:62px;border-radius:18px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;background:linear-gradient(145deg,#3b82f6,#22c55e);color:#fff;font-size:28px;font-weight:900;transform:translate(-50%,-50%);box-shadow:0 14px 28px rgba(0,0,0,.28);cursor:pointer;transition:.08s}
.packet.bad{background:linear-gradient(145deg,#ef4444,#f59e0b)}.packet.hit{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;z-index:5}.card{width:min(560px,100%);padding:28px;text-align:center;border-radius:22px;background:rgba(7,12,25,.86);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.32)}
h1{margin:0 0 12px;font-size:clamp(34px,7vw,58px);line-height:.98;letter-spacing:-.04em}p{color:var(--muted);line-height:1.6}
button{border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:800;cursor:pointer}.hint{margin-top:12px;color:#8fa0b6;font-size:13px}
.flash{position:absolute;z-index:4;font-weight:900;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);animation:float .5s ease forwards}@keyframes float{to{opacity:0;transform:translate(-50%,-90%) scale(1.2)}}
.footer{text-align:center;color:#7e8ba0;font-size:13px}
@media(max-width:600px){body{padding:9px}.game{height:73svh;min-height:500px}.packet{width:56px;height:56px;border-radius:16px}.card{padding:22px}}
</style>
</head>
<body>
<main class="app">
<div class="top">
<div class="brand"><span class="dot"></span>Kleenernetz · Packet Catch</div>
<div class="stats"><div class="pill">Punkte: <b id="score">0</b></div><div class="pill">Zeit: <b id="time">30</b>s</div><div class="pill">Highscore: <b id="high">0</b></div></div>
</div>
<section class="panel">
<div class="game" id="game">
<div class="overlay" id="overlay">
<div class="card">
<h1>Packet Catch 📦</h1>
<p>Fang in 30 Sekunden so viele grüne Datenpakete wie möglich. Rote Pakete kosten 2 Punkte. 😈</p>
<button id="start">Spiel starten</button>
<div class="hint">Funktioniert mit Maus, Touch und Stift.</div>
</div>
</div>
</div>
</section>
<div class="footer">kleenernetz.de · kleiner öffentlicher Test 😎</div>
</main>
<script>
const game=document.getElementById('game'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),highEl=document.getElementById('high');
let score=0,timeLeft=30,running=false,spawnTimer,countdownTimer;
const KEY='kleenernetz_packet_highscore_v1';let high=Number(localStorage.getItem(KEY)||0);highEl.textContent=high;
function rand(a,b){return Math.random()*(b-a)+a}
function flash(t,x,y,bad){const e=document.createElement('div');e.className='flash';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';e.style.color=bad?'#fca5a5':'#bbf7d0';game.appendChild(e);setTimeout(()=>e.remove(),520)}
function spawn(){
 if(!running)return;
 const r=game.getBoundingClientRect(),pad=40,bad=Math.random()<.18,x=rand(pad,r.width-pad),y=rand(pad,r.height-pad);
 const p=document.createElement('button');p.className='packet'+(bad?' bad':'');p.textContent=bad?'⚠':'⬢';p.style.left=x+'px';p.style.top=y+'px';
 let gone=false;const life=setTimeout(()=>{if(!gone){gone=true;p.remove()}},bad?1100:900);
 p.onpointerdown=e=>{e.preventDefault();if(!running||gone)return;gone=true;clearTimeout(life);score=bad?Math.max(0,score-2):score+1;scoreEl.textContent=score;flash(bad?'-2':'+1',x,y,bad);if(navigator.vibrate)navigator.vibrate(bad?60:20);p.classList.add('hit');setTimeout(()=>p.remove(),100)};
 game.appendChild(p);spawnTimer=setTimeout(spawn,rand(Math.max(260,650-score*10)*.75,Math.max(260,650-score*10)*1.25));
}
function clean(){game.querySelectorAll('.packet,.flash').forEach(e=>e.remove())}
function end(){
 running=false;clearTimeout(spawnTimer);clearInterval(countdownTimer);clean();
 if(score>high){high=score;localStorage.setItem(KEY,high);highEl.textContent=high}
 overlay.innerHTML=`<div class="card"><h1>${score>=25?'Stark! 🔥':score>=15?'Sauber! 😎':'Nochmal? 😄'}</h1><p>Du hast <b style="color:white">${score} Punkte</b> geschafft.${score===high&&score>0?'<br>Neuer Highscore! 🏆':''}</p><button id="again">Nochmal spielen</button><div class="hint">Highscore bleibt auf diesem Gerät gespeichert.</div></div>`;
 overlay.style.display='grid';document.getElementById('again').onclick=start;
}
function start(){
 clean();score=0;timeLeft=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;overlay.style.display='none';spawn();
 countdownTimer=setInterval(()=>{timeEl.textContent=--timeLeft;if(timeLeft<=0)end()},1000);
}
document.getElementById('start').onclick=start;
</script>
</body>
</html>
