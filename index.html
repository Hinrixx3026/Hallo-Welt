<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Kleenernetz – Hallo Welt</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(16,185,129,.16), transparent 35%),
        #0b1020;
      color: #f8fafc;
    }
    main {
      width: min(720px, 100%);
      padding: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 26px;
      background: rgba(17,24,39,.76);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.28);
      color: #bbf7d0;
      font-size: 14px;
      font-weight: 700;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 16px rgba(34,197,94,.9);
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: .95;
      letter-spacing: -0.05em;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.65;
    }
    strong { color: #fff; }
    footer {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span> Kleenernetz ist online</div>
    <h1>Hallo Welt. 👋</h1>
    <p>
      Wenn du das hier siehst, funktioniert der erste öffentliche Test von
      <strong>kleenernetz.de</strong>. Noch ist es nur eine kleine Seite –
      später wohnt hier unser eigenes Intranet. 😎
    </p>
    <footer>
      <span>Projekt: Der Kleene</span>
      <span id="time">Bereit.</span>
    </footer>
  </main>
  <script>
    const el = document.getElementById('time');
    const update = () => {
      el.textContent = new Intl.DateTimeFormat('de-DE', {
        dateStyle: 'medium',
        timeStyle: 'medium'
      }).format(new Date());
    };
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
